# Publishing a release. Push a tag like v1.0.0 and this:
#
#   1. checks the tag matches the version written in the code, and runs the tests;
#   2. builds the desktop installers: macOS (Apple Silicon and Intel) and Windows;
#   3. builds the Docker image for amd64 and arm64 and pushes it to GHCR;
#   4. creates the GitHub Release, with the changelog section as its notes
#      and the installers attached.
#
# Signing is optional and switches itself on: add the secrets named in
# docs/SIGNING.md and the next tag is signed. With none set, the installers
# are unsigned and the README says how to open them.
#
# "Run workflow" (workflow_dispatch) builds everything without publishing:
# the installers are kept as artifacts of the run, to try before tagging.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    name: Version and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Read the version
        id: version
        run: echo "version=$(python -c 'import app; print(app.__version__)')" >> "$GITHUB_OUTPUT"

      - name: The tag must be the version
        if: env.PUBLISH == 'true'
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${{ steps.version.outputs.version }} in app/__init__.py"
            exit 1
          fi

      - name: Tests
        run: python -m pytest

      - name: Release notes from the changelog
        run: python scripts/release_notes.py "${{ steps.version.outputs.version }}" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            bundles: dmg
          - name: macOS Intel
            os: macos-15-intel
            bundles: dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Freeze the server
        run: |
          pip install -r requirements.txt -r desktop/requirements-build.txt
          python desktop/build_server.py

      # --- Signing: each block does nothing unless its secrets exist ----------
      - name: Apple signing and notarisation, if set up
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate: building unsigned (ad-hoc)."
            exit 0
          fi
          # Hand them to the build step. Tauri imports the certificate into a
          # temporary keychain, signs, and notarises when the Apple ID is here.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] && echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "Apple signing is on."

      - name: Windows signing, if set up
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No Windows certificate: building unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 -Compress
          $path = Join-Path $env:RUNNER_TEMP "signing.json"
          Set-Content -Path $path -Value $config -Encoding utf8
          "TAURI_SIGNING_CONFIG=$path" >> $env:GITHUB_ENV
          Write-Host "Windows signing is on."

      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          if [ -n "${TAURI_SIGNING_CONFIG:-}" ]; then
            npx tauri build --bundles "${{ matrix.bundles }}" --config "$TAURI_SIGNING_CONFIG"
          else
            npx tauri build --bundles "${{ matrix.bundles }}"
          fi

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p out
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg out/ 2>/dev/null || true
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe out/ 2>/dev/null || true
          ls -l out
          [ -n "$(ls -A out)" ] || { echo "::error::No installer was produced"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  docker:
    name: Docker image (amd64 + arm64)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=sha,enable=${{ env.PUBLISH != 'true' }}
      - uses: docker/build-push-action@v6
        env:
          # No build-record artifact on the run: nothing reads it, and see
          # the publish job for what it broke.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only what this job publishes, by name. Asking for everything also
      # asks for the build record the Docker step used to attach, which is
      # not a zip of ours and failed the very first release at this step.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: artifacts/release-notes
      - name: Gather the files
        run: |
          mkdir release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "zakvaska ${{ needs.check.outputs.version }}" \
            --notes-file artifacts/release-notes/release-notes.md \
            --verify-tag
