[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Our own code must not emit deprecation warnings. Third-party ones stay
# visible on purpose rather than being silenced.
# Note: starlette's own StarletteDeprecationWarning subclasses UserWarning,
# not DeprecationWarning, so a DeprecationWarning filter will not match it.
filterwarnings = ["error::DeprecationWarning:app.*"]
