{# The bread maker, drawn: lid, window, panel and a bit of steam.

   Optionally `art_class` for the size. Takes nothing else — there is one
   machine, and the programs on the page are its.
#}
{%- set classes = ["machine-art", art_class] | select | join(" ") -%}
<svg class="{{ classes }}" viewBox="0 0 96 92"
     role="img" aria-label="A bread maker with its lid down">
  <ellipse class="machine-shadow" cx="48" cy="85" rx="38" ry="4"/>

  <!-- steam out of the vent, because something is always proving in there -->
  <g class="machine-steam" aria-hidden="true">
    <path d="M38 14 C34 10 42 8 38 3"/>
    <path d="M48 12 C44 7 52 5 48 0.5"/>
    <path d="M58 14 C54 10 62 8 58 3"/>
  </g>

  <!-- the case, a shade wider at the foot the way these machines are -->
  <path class="machine-body"
        d="M16 32 H80 L84 78 Q84 83 79 83 H17 Q12 83 12 78 Z"/>

  <!-- lid, with the window you watch the loaf through -->
  <rect class="machine-lid" x="10" y="18" width="76" height="15" rx="4"/>
  <rect class="machine-window" x="33" y="20.5" width="30" height="10" rx="5"/>
  <rect class="machine-glint" x="37" y="22.5" width="9" height="2.6" rx="1.3"/>
  <g class="machine-vents">
    <rect x="17" y="23" width="11" height="1.8" rx="0.9"/>
    <rect x="17" y="26.6" width="11" height="1.8" rx="0.9"/>
    <rect x="68" y="23" width="11" height="1.8" rx="0.9"/>
    <rect x="68" y="26.6" width="11" height="1.8" rx="0.9"/>
  </g>

  <!-- the panel: a little screen, a row of buttons, and the light that
       tells you it is still running -->
  <rect class="machine-panel" x="21" y="46" width="54" height="26" rx="3"/>
  <rect class="machine-screen" x="26" y="50" width="25" height="11" rx="2"/>
  <g class="machine-digits">
    <rect x="29" y="53.5" width="2.4" height="4" rx="1"/>
    <rect x="33" y="53.5" width="2.4" height="4" rx="1"/>
    <rect x="38.5" y="53.5" width="2.4" height="4" rx="1"/>
    <rect x="42.5" y="53.5" width="2.4" height="4" rx="1"/>
  </g>
  <circle class="machine-light" cx="66" cy="55.5" r="3.2"/>
  <g class="machine-buttons">
    <circle cx="28" cy="66.5" r="2.6"/>
    <circle cx="37" cy="66.5" r="2.6"/>
    <circle cx="46" cy="66.5" r="2.6"/>
    <circle cx="55" cy="66.5" r="2.6"/>
    <circle cx="66" cy="66.5" r="2.6"/>
  </g>

  <path class="machine-outline"
        d="M16 32 H80 L84 78 Q84 83 79 83 H17 Q12 83 12 78 Z"/>
</svg>
