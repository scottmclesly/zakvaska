{# Photos for one thing, plus the form to add another.
   Expects `photos`, `owner_type`, `owner_id`, and optionally `gallery_title`. #}
<section class="gallery-block">
  <h2 class="section-title">{{ gallery_title or "Photos" }}</h2>

  {% if photos %}
  <ul class="gallery">
    {% for photo in photos %}
    <li class="shot">
      <a href="{{ photo.url }}" target="_blank" rel="noopener">
        <img src="{{ photo.thumb_url }}" alt="{{ photo.caption or 'Photo taken ' ~ (photo.taken_at | local_dt) }}"
             loading="lazy" width="240" height="240">
      </a>
      <form class="shot-caption" method="post" action="/photos/{{ photo.id }}/caption">
        <label class="sr-only" for="caption-{{ photo.id }}">Caption</label>
        <input id="caption-{{ photo.id }}" name="caption" value="{{ photo.caption or '' }}"
               placeholder="Caption">
        <button class="btn btn-small btn-secondary" type="submit">Save</button>
      </form>
      <p class="shot-when muted small">
        {{ photo.taken_at | local_dt }}
        <form method="post" action="/photos/{{ photo.id }}/delete"
              onsubmit="return confirm('Delete this photo? The file goes too.')">
          <button class="linkish" type="submit">Delete</button>
        </form>
      </p>
    </li>
    {% endfor %}
  </ul>
  {% endif %}

  <form class="card form upload" method="post" action="/photos/upload"
        enctype="multipart/form-data">
    <input type="hidden" name="owner_type" value="{{ owner_type }}">
    <input type="hidden" name="owner_id" value="{{ owner_id }}">
    <div class="field-row">
      <label>
        <span>Add a photo</span>
        {# capture lets a phone go straight to the camera. #}
        <input type="file" name="photo" accept="image/*" capture="environment" required>
      </label>
      <label>
        <span>Caption <em>optional</em></span>
        <input name="caption" placeholder="e.g. crumb, 2 h after slicing">
      </label>
    </div>
    <div class="row-actions">
      <button class="btn" type="submit">Upload</button>
    </div>
  </form>
</section>
