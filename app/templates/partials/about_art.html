{# The experiment, drawn: the two rye jars either side of the loaf they are
   for, standing on the same shelf as the ones on the dashboard. Inline SVG
   so it themes with the page and costs no request. #}
{%- set body = jar_body_path -%}
<svg class="scene-art" viewBox="0 0 168 96" role="img"
     aria-label="Two starter jars either side of a dark rye loaf, on a shelf">
  <defs>
    <clipPath id="scene-jar-left"><path d="{{ body }}"/></clipPath>
    <clipPath id="scene-jar-right"><path d="{{ body }}"/></clipPath>
  </defs>

  <!-- homemade whole rye, on the left, lively -->
  <g transform="translate(-2 18) scale(0.58)">
    <rect class="jar-lid" x="20" y="4" width="32" height="10" rx="3"/>
    <rect class="jar-band" x="22" y="12.5" width="28" height="5.5" rx="2"/>
    <rect class="jar-neck" x="24" y="17" width="24" height="3"/>
    <path class="jar-glass" d="{{ body }}"/>
    <g clip-path="url(#scene-jar-left)">
      <rect class="jar-contents scene-rye" x="14" y="50" width="44" height="50"/>
      <ellipse class="jar-contents scene-rye jar-dome" cx="36" cy="50" rx="22" ry="4.2"/>
      <circle class="jar-bubble" cx="24" cy="51" r="2.6"/>
      <circle class="jar-bubble" cx="36" cy="49" r="3"/>
      <circle class="jar-bubble" cx="48" cy="51" r="2.3"/>
      <circle class="jar-bubble" cx="28" cy="62" r="2.8"/>
      <circle class="jar-bubble" cx="45" cy="68" r="2"/>
      <rect class="jar-rubber" x="14" y="68.6" width="44" height="2.2"/>
      <rect class="jar-shine" x="18.5" y="26" width="4.6" height="54" rx="2.3"/>
    </g>
    <path class="jar-outline" d="{{ body }}"/>
    <g clip-path="url(#scene-jar-left)">
      <g transform="rotate(-2.4 36 84)">
        <rect class="jar-label" x="14" y="75" width="44" height="17" rx="1.5"/>
        <text class="jar-label-name" x="36" y="87" text-anchor="middle"
              font-size="8.6">homemade</text>
      </g>
    </g>
  </g>

  <!-- the bought Soviet culture, the control, on the right -->
  <g transform="translate(126 18) scale(0.58)">
    <rect class="jar-lid" x="20" y="4" width="32" height="10" rx="3"/>
    <rect class="jar-band" x="22" y="12.5" width="28" height="5.5" rx="2"/>
    <rect class="jar-neck" x="24" y="17" width="24" height="3"/>
    <path class="jar-glass" d="{{ body }}"/>
    <g clip-path="url(#scene-jar-right)">
      <rect class="jar-contents scene-control" x="14" y="58" width="44" height="42"/>
      <ellipse class="jar-contents scene-control jar-dome" cx="36" cy="58" rx="22" ry="3"/>
      <circle class="jar-bubble" cx="27" cy="60" r="2"/>
      <circle class="jar-bubble" cx="43" cy="66" r="1.6"/>
      <rect class="jar-rubber" x="14" y="68.6" width="44" height="2.2"/>
      <rect class="jar-shine" x="18.5" y="26" width="4.6" height="54" rx="2.3"/>
    </g>
    <path class="jar-outline" d="{{ body }}"/>
    <g clip-path="url(#scene-jar-right)">
      <g transform="rotate(-2.4 36 84)">
        <rect class="jar-label" x="14" y="75" width="44" height="17" rx="1.5"/>
        <text class="jar-label-name is-control" x="36" y="87" text-anchor="middle"
              font-size="8.6">control</text>
      </g>
    </g>
  </g>

  <!-- borodinsky: a dark pan loaf, scored, with coriander on top -->
  <path class="scene-crumb"
        d="M48 70 v-18 a26 10 0 0 1 72 0 v18 a4 4 0 0 1 -4 4 h-64 a4 4 0 0 1 -4 -4 z"/>
  <path class="scene-crust"
        d="M48 52 a26 10 0 0 1 72 0 a26 7 0 0 1 -72 0 z"/>
  <path class="scene-score" d="M62 49 q22 -7 44 0"/>
  <circle class="scene-seed" cx="72" cy="47.5" r="1.5"/>
  <circle class="scene-seed" cx="84" cy="45.4" r="1.5"/>
  <circle class="scene-seed" cx="96" cy="45.6" r="1.5"/>
  <circle class="scene-seed" cx="107" cy="47.8" r="1.5"/>

  <!-- the shelf they are all standing on -->
  <rect class="scene-shelf" x="2" y="74" width="164" height="6" rx="1.5"/>
  <path class="scene-shelf-edge" d="M2 80 h164"/>
</svg>
