{# The feeding ribbon in a card of its own. Expects `ribbon`
   (services.ribbon.Ribbon).

   Optionally:
     ribbon_title    a heading; omit for none
     ribbon_caption  a line underneath; a default is supplied

   The drawing itself is ribbon_svg.html, which the Fed-it form reuses.
#}
<figure class="ribbon-card card">
  {%- if ribbon_title %}
  <figcaption class="chart-head">
    <h2 class="section-title">{{ ribbon_title }}</h2>
    <span class="muted small">next {{ ribbon.span_h | round | int }} hours</span>
  </figcaption>
  {%- endif %}

  {% include "partials/ribbon_svg.html" %}

  <ul class="ribbon-key plain">
    <li><span class="ribbon-swatch band-rising"></span>rising</li>
    <li><span class="ribbon-swatch band-peak"></span>at peak</li>
    <li><span class="ribbon-swatch band-ok"></span>still good</li>
    <li><span class="ribbon-swatch band-past"></span>going over</li>
    <li><span class="ribbon-swatch band-hungry"></span>hungry</li>
    {%- if ribbon.busy %}
    <li><span class="ribbon-swatch is-busy"></span>busy</li>
    {%- endif %}
  </ul>

  <p class="chart-caption muted small">
    {%- if ribbon_caption %}{{ ribbon_caption }}
    {%- else %}Solid markers are feeds that happened; hollow ones are planned.
    The curve is predicted from the feed's ratio and temperature.
    {%- endif %}
  </p>
</figure>
