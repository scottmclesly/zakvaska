<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block page_title %}{{ title }}{% endblock %}</title>

  <meta name="theme-color" content="#7a4a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="jar-log">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/icon-192.png') }}">
  <link rel="icon" href="{{ url_for('static', path='/icons/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  <script src="{{ url_for('static', path='/js/htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">🫙</span>
      <span class="brand-name">jar-log</span>
    </a>
    <nav class="topnav">
      {% block nav %}{% endblock %}
    </nav>
    <nav class="sectionnav" aria-label="Sections">
      <a class="navlink" href="/">Jars</a>
      <a class="navlink" href="/recipes">Recipes</a>
      <a class="navlink" href="/bakes">Bakes</a>
      <a class="navlink" href="/equipment">Equipment</a>
    </nav>
  </header>

  {% if alerts %}
  {% include "partials/alert_banner.html" %}
  {% endif %}

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>jar-log v{{ app_version }}</span>
    <span aria-hidden="true">·</span>
    <a class="footer-link" href="/backup">Backup</a>
  </footer>

  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</body>
</html>
